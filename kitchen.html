<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard - QuickDine</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f111a; padding: 20px; }
        .order-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .item-list { list-style: none; padding: 0; margin: 0; }
        .item-list li { padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; }
        .status-pending { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107; }
        .status-preparing { background: rgba(0, 123, 255, 0.2); color: #007bff; border: 1px solid #007bff; }
        .status-ready { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745; }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header class="glass-header" style="position: static; margin-bottom: 30px;">
        <div class="logo">Kitchen<span>Dashboard</span></div>
    </header>

    <div id="orders-container" style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
        <h2 style="color: white; width: 100%; grid-column: 1 / -1;">Active Orders</h2>
        <!-- Orders injected here -->
    </div>

    <script>
        const API_URL = `http://${window.location.hostname}:8000/api/orders`;
        const CLOUD_API_URL = 'https://crudcrud.com/api/e5a9c6fc83b74efc9ced302d8cbc80a0/orders';

        async function fetchOrders() {
            let ordersMap = new Map();

            // 1. Try Local Storage
            const localOrders = JSON.parse(localStorage.getItem('quickdine_all_orders')) || [];
            localOrders.forEach(o => ordersMap.set(o.id || o._id, o));

            // 2. Try Cloud Sync API (cross-device)
            try {
                const cloudResp = await fetch(CLOUD_API_URL);
                if (cloudResp.ok) {
                    const cloudOrders = await cloudResp.json();
                    cloudOrders.forEach(co => {
                        const oid = co.id || co._id;
                        ordersMap.set(oid, {
                            id: oid,
                            table_number: co.table_number,
                            items: co.items || [],
                            total_amount: co.total_amount || 0,
                            status: co.status || 'pending',
                            created_at: co.created_at || new Date().toISOString(),
                            _cloudId: co._id
                        });
                    });
                }
            } catch (err) {}

            // 3. Try Local Backend API
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const backendOrders = await response.json();
                    backendOrders.forEach(bo => ordersMap.set(bo.id, bo));
                }
            } catch (err) {}

            const orders = Array.from(ordersMap.values());
            renderOrders(orders);
        }

        async function updateStatus(orderId, newStatus) {
            try {
                await fetch(`${API_URL}/${orderId}/status?status=${newStatus}`, { method: 'PUT' });
            } catch (err) {}

            let orders = JSON.parse(localStorage.getItem('quickdine_all_orders')) || [];
            const idx = orders.findIndex(o => (o.id === orderId || o._id === orderId));
            if (idx !== -1) {
                orders[idx].status = newStatus;
                localStorage.setItem('quickdine_all_orders', JSON.stringify(orders));
            }
            fetchOrders();
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            let html = '<h2 style="color: white; width: 100%; grid-column: 1 / -1;">Active Orders</h2>';
            
            const activeOrders = orders.filter(o => o.status !== 'served');
            
            if (activeOrders.length === 0) {
                html += '<p style="color: var(--text-muted);">No active orders at the moment.</p>';
            }

            activeOrders.forEach(order => {
                let badgeClass = 'status-pending';
                if (order.status === 'preparing') badgeClass = 'status-preparing';
                if (order.status === 'ready_for_waiter') badgeClass = 'status-ready';

                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <h3 style="margin: 0; color: white;">Table #${order.table_number}</h3>
                                <small style="color: var(--text-muted);">${order.id}</small>
                            </div>
                            <span class="status-badge ${badgeClass}">${order.status.replace('_', ' ').toUpperCase()}</span>
                        </div>
                        <ul class="item-list">
                            ${order.items.map(item => `
                                <li style="color: #eee;">
                                    <span style="font-weight: bold; color: var(--primary);">${item.quantity}x</span> ${item.title}
                                </li>
                            `).join('')}
                        </ul>
                        <div class="actions">
                            ${order.status === 'pending' ? `<button class="cta-btn primary-btn" onclick="updateStatus('${order.id}', 'preparing')" style="font-size: 0.9rem; padding: 8px 15px;">Start Preparing</button>` : ''}
                            ${order.status === 'preparing' ? `<button class="cta-btn primary-btn" onclick="updateStatus('${order.id}', 'ready_for_waiter')" style="font-size: 0.9rem; padding: 8px 15px; background: #28a745; box-shadow: none;">Ready for Waiter</button>` : ''}
                            ${order.status === 'ready_for_waiter' ? `<button class="cta-btn secondary-btn" onclick="updateStatus('${order.id}', 'served')" style="font-size: 0.9rem; padding: 8px 15px;">Mark as Served</button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Fetch initially and then poll every 3 seconds
        fetchOrders();
        setInterval(fetchOrders, 3000);
    </script>
</body>
</html>
