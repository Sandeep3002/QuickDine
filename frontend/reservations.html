<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickDine - Reservations</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      .page-container {
        padding: 60px 20px;
        max-width: 800px;
        margin: 0 auto;
        min-height: calc(100vh - 100px);
      }
      .booking-box {
        background: rgba(255, 255, 255, 0.03);
        padding: 50px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      .booking-box h1 {
        margin-top: 0;
        font-size: 3rem;
        color: var(--primary);
        font-weight: 800;
      }
      #booking-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
      }
      #booking-form input, #booking-form select {
        padding: 15px 20px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-family: 'Outfit', sans-serif;
        font-size: 1.1rem;
        transition: border-color 0.3s;
      }
      #booking-form input:focus, #booking-form select:focus {
        outline: none;
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header class="glass-header" style="background: #0f1014; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <div class="logo">Quick<span>Dine</span></div>
      <nav>
        <a href="/">Home</a>
        <a href="/menu.html">Menu</a>
        <a href="/reservations.html" style="color: var(--primary)">Reservations</a>
        <a href="/contact.html">Contact</a>
      </nav>
      <div class="header-cart" style="justify-self: end; cursor: pointer; position: relative;">
        <svg width="24" height="24" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="header-cart-count" style="position: absolute; top: -8px; right: -8px; background: var(--primary); color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: bold; display: none;">0</span>
      </div>
    </header>

    <div class="page-container animate-up">
      <div class="booking-box">
        <h1>Book a Table</h1>
        <p style="color: var(--text-muted); font-size: 1.2rem; margin-bottom: 30px;">Reserve your spot for an unforgettable dining experience. We will send you a confirmation email shortly.</p>
        <form id="booking-form" onsubmit="event.preventDefault(); this.innerHTML = '<h3 style=\'color: #2ed573; text-align: center; font-size: 1.8rem;\'>Reservation Confirmed! ✓<br><br><span style=\'font-size: 1.1rem; color: var(--text-muted);\'>We look forward to hosting you.</span></h3>';">
          <input type="text" placeholder="Full Name" required>
          <input type="email" placeholder="Email Address" required>
          <div style="display: flex; gap: 20px;">
            <input type="date" required style="flex: 1;">
            <input type="time" required style="flex: 1;">
          </div>
          <input type="number" placeholder="Number of Guests" min="1" max="20" required>
          <button type="submit" class="cta-btn primary-btn large" style="margin-top: 10px;">Confirm Reservation</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/cart.js"></script>
  </body>
</html>
