<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickDine – Kitchen Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d0f18;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #12141f 0%, #1a1d2e 100%);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 107, 107, 0.3);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    #clock {
      font-size: 1.1rem;
      font-weight: 600;
      color: #aaa;
      font-variant-numeric: tabular-nums;
    }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 213, 115, 0.1);
      border: 1px solid rgba(46, 213, 115, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      color: #2ed573;
      font-weight: 600;
    }
    .dot {
      width: 8px; height: 8px;
      background: #2ed573;
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex;
      gap: 1rem;
      padding: 1rem 2rem;
      background: #12141f;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 0.6rem 1.2rem;
      min-width: 120px;
    }
    .stat-num { font-size: 1.6rem; font-weight: 800; }
    .stat-label { font-size: 0.75rem; color: #888; margin-top: 2px; }
    .stat-num.orange { color: #ffa502; }
    .stat-num.blue   { color: #3498db; }
    .stat-num.green  { color: #2ed573; }
    .stat-num.red    { color: #ff6b6b; }

    /* ── Columns layout ── */
    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      padding: 1.2rem 2rem;
    }
    @media (max-width: 900px) {
      .columns { grid-template-columns: 1fr; }
    }

    .column-header {
      padding: 0.7rem 1rem;
      border-radius: 10px 10px 0 0;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .col-pending   .column-header { background: rgba(255,165,2,0.15);  color: #ffa502; border-bottom: 2px solid #ffa502; }
    .col-preparing .column-header { background: rgba(52,152,219,0.15); color: #3498db; border-bottom: 2px solid #3498db; }
    .col-ready     .column-header { background: rgba(46,213,115,0.15); color: #2ed573; border-bottom: 2px solid #2ed573; }

    .column-body {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      padding-top: 0.8rem;
      min-height: 200px;
    }

    /* ── Order card ── */
    .order-card {
      background: linear-gradient(135deg, #1e2235, #1a1d2e);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
    }
    .order-id {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffa502;
    }
    .table-tag {
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.8rem;
      color: #ccc;
      font-weight: 600;
    }
    .elapsed {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 0.5rem;
    }
    .elapsed.warning { color: #ffa502; }
    .elapsed.urgent  { color: #ff6b6b; }

    .items-list { margin: 0.4rem 0 0.8rem; }
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.88rem;
      color: #ddd;
    }
    .item-row:last-child { border: none; }
    .item-qty {
      display: inline-block;
      background: rgba(255,165,2,0.2);
      color: #ffa502;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 4px;
      margin-right: 6px;
      font-size: 0.82rem;
    }
    .item-price { color: #777; font-size: 0.82rem; }

    .special-note {
      background: rgba(255,165,2,0.08);
      border-left: 3px solid #ffa502;
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      font-size: 0.82rem;
      color: #ffa502;
      margin-bottom: 0.8rem;
    }

    .action-btn {
      width: 100%;
      padding: 0.55rem;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .action-btn:hover { opacity: 0.85; }
    .action-btn:active { transform: scale(0.98); }
    .btn-start    { background: linear-gradient(135deg, #3498db, #2980b9); color: #fff; }
    .btn-ready    { background: linear-gradient(135deg, #2ed573, #27c261); color: #fff; }
    .btn-served   { background: linear-gradient(135deg, #636e72, #4d5656); color: #fff; }

    .empty-col {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      padding: 2rem 0;
    }
    .badge-count {
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<header>
  <h1>🍳 QuickDine Kitchen Display</h1>
  <div class="header-right">
    <div id="clock"></div>
    <div class="live-badge"><div class="dot"></div> Auto Refreshing</div>
  </div>
</header>

<!-- Stats bar -->
<div class="stats-bar">
  <div class="stat"><span class="stat-num orange" id="cnt-pending">0</span><span class="stat-label">New Orders</span></div>
  <div class="stat"><span class="stat-num blue"   id="cnt-preparing">0</span><span class="stat-label">Preparing</span></div>
  <div class="stat"><span class="stat-num green"  id="cnt-ready">0</span><span class="stat-label">Ready to Serve</span></div>
  <div class="stat"><span class="stat-num red"    id="cnt-bill">0</span><span class="stat-label">Bill Requested</span></div>
</div>

<!-- Kanban columns -->
<div class="columns">
  <div class="col-pending">
    <div class="column-header">
      🔔 New Orders
      <span class="badge-count" id="badge-pending">0</span>
    </div>
    <div class="column-body" id="col-pending"></div>
  </div>

  <div class="col-preparing">
    <div class="column-header">
      🔥 Preparing
      <span class="badge-count" id="badge-preparing">0</span>
    </div>
    <div class="column-body" id="col-preparing"></div>
  </div>

  <div class="col-ready">
    <div class="column-header">
      ✅ Ready to Serve
      <span class="badge-count" id="badge-ready">0</span>
    </div>
    <div class="column-body" id="col-ready"></div>
  </div>
</div>

<script>
const API = `http://${window.location.hostname}:8000`;

/* ── Clock ── */
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}
updateClock();
setInterval(updateClock, 1000);

/* ── Elapsed time helper ── */
function elapsedLabel(createdAt) {
  const diff = Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000);
  if (diff < 60) return { text: `${diff}s ago`, cls: '' };
  const mins = Math.floor(diff / 60);
  if (mins < 10) return { text: `${mins}m ago`, cls: '' };
  if (mins < 20) return { text: `${mins}m ago`, cls: 'warning' };
  return { text: `${mins}m ago ⚠️`, cls: 'urgent' };
}

/* ── Update order status via API ── */
async function updateStatus(orderId, newStatus, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch(`${API}/api/orders/${orderId}/status?status=${newStatus}`, { method: 'PUT' });
    if (!res.ok) throw new Error('Failed');
    await loadKitchen(); // refresh immediately
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Retry';
    console.error(e);
  }
}

/* ── Build one order card ── */
function buildCard(order) {
  const el = document.createElement('div');
  el.className = 'order-card';

  const elapsed = elapsedLabel(order.created_at);

  let itemsHtml = '';
  (order.items || []).forEach(it => {
    itemsHtml += `
      <div class="item-row">
        <span><span class="item-qty">${it.quantity}</span>${it.title}</span>
        <span class="item-price">${it.price}</span>
      </div>`;
  });

  let noteHtml = '';
  if (order.special_instructions) {
    noteHtml = `<div class="special-note">📝 ${order.special_instructions}</div>`;
  }

  let actionHtml = '';
  if (order.status === 'pending') {
    actionHtml = `<button class="action-btn btn-start" data-id="${order.id}" data-next="preparing">▶ Start Preparing</button>`;
  } else if (order.status === 'preparing') {
    actionHtml = `<button class="action-btn btn-ready" data-id="${order.id}" data-next="ready_for_waiter">✅ Mark Ready</button>`;
  } else if (order.status === 'ready_for_waiter') {
    actionHtml = `<button class="action-btn btn-served" data-id="${order.id}" data-next="served">☑ Mark Served</button>`;
  }

  el.innerHTML = `
    <div class="card-top">
      <span class="order-id">${order.id}</span>
      <span class="table-tag">🪑 Table ${order.table_number}</span>
    </div>
    <div class="elapsed ${elapsed.cls}">${elapsed.text}</div>
    <div class="items-list">${itemsHtml}</div>
    ${noteHtml}
    ${actionHtml}
  `;

  // Attach event listener to button
  const btn = el.querySelector('.action-btn');
  if (btn) {
    btn.addEventListener('click', () => updateStatus(btn.dataset.id, btn.dataset.next, btn));
  }

  return el;
}

/* ── Main load function ── */
async function loadKitchen() {
  try {
    const res = await fetch(`${API}/api/orders`);
    const orders = await res.json();

    const pending    = orders.filter(o => o.status === 'pending');
    const preparing  = orders.filter(o => o.status === 'preparing');
    const ready      = orders.filter(o => o.status === 'ready_for_waiter');
    const billOrders = orders.filter(o => o.status === 'bill_requested');

    // Update stats
    document.getElementById('cnt-pending').textContent   = pending.length;
    document.getElementById('cnt-preparing').textContent = preparing.length;
    document.getElementById('cnt-ready').textContent     = ready.length;
    document.getElementById('cnt-bill').textContent      = billOrders.length;

    document.getElementById('badge-pending').textContent   = pending.length;
    document.getElementById('badge-preparing').textContent = preparing.length;
    document.getElementById('badge-ready').textContent     = ready.length;

    // Render columns
    const renderCol = (colId, list) => {
      const col = document.getElementById(colId);
      col.innerHTML = '';
      if (list.length === 0) {
        col.innerHTML = '<div class="empty-col">No orders here</div>';
        return;
      }
      list.forEach(o => col.appendChild(buildCard(o)));
    };

    renderCol('col-pending',   pending);
    renderCol('col-preparing', preparing);
    renderCol('col-ready',     ready);

  } catch (err) {
    console.error('Kitchen fetch failed:', err);
  }
}

/* ── Auto refresh every 5 seconds ── */
loadKitchen();
setInterval(loadKitchen, 5000);
</script>

</body>
</html>
