<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickDine – Printable Table QR Codes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f1117;
      color: #fff;
      padding: 2rem;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6b6b, #ffa502);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #aaa;
      margin-top: 0.5rem;
      font-size: 1rem;
    }
    .print-btn {
      margin-top: 1rem;
      padding: 0.7rem 1.8rem;
      background: #2ed573;
      color: #111;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .print-btn:hover { background: #26af5f; }
    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .qr-card {
      background: #1a1d2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .qr-card h2 {
      font-size: 1.4rem;
      color: #ffa502;
      margin-bottom: 0.8rem;
    }
    .qr-img {
      width: 180px;
      height: 180px;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      margin: 0 auto 1rem auto;
      display: block;
    }
    .qr-url {
      font-size: 0.75rem;
      color: #888;
      word-break: break-all;
    }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .header p, .print-btn { display: none; }
      .qr-card {
        background: #fff;
        border: 2px solid #333;
        box-shadow: none;
        page-break-inside: avoid;
      }
      .qr-card h2 { color: #000; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📱 Restaurant Table QR Codes</h1>
  <p>Scan any QR code below using your phone to order for that table.</p>
  <button class="print-btn" onclick="window.print()">🖨️ Print QR Cards</button>
</div>

<div class="qr-grid" id="qr-grid"></div>

<script>
  const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
  let SITE_BASE;
  if (isLocal) {
    const LAN_IP = '192.168.1.11';
    const PORT = window.location.port ? `:${window.location.port}` : ':5173';
    SITE_BASE = `http://${LAN_IP}${PORT}`;
  } else {
    SITE_BASE = window.location.origin;
  }
  const grid = document.getElementById('qr-grid');

  for (let i = 1; i <= 10; i++) {
    const targetUrl = `${SITE_BASE}/menu.html?table=${i}`;
    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(targetUrl)}`;
    
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML = `
      <h2>Table #${i}</h2>
      <img class="qr-img" src="${qrApiUrl}" alt="Table ${i} QR Code" />
      <div class="qr-url">${targetUrl}</div>
    `;
    grid.appendChild(card);
  }
</script>

</body>
</html>
