<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickDine - Contact Us</title>
    <link rel="stylesheet" href="/src/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      .page-container {
        padding: 60px 20px;
        max-width: 800px;
        margin: 0 auto;
        min-height: calc(100vh - 100px);
      }
      .contact-box {
        background: rgba(255, 255, 255, 0.03);
        padding: 50px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      }
      .contact-box h1 {
        margin-top: 0;
        font-size: 3rem;
        color: var(--primary);
        font-weight: 800;
      }
      .contact-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 40px;
        flex-wrap: wrap;
        gap: 20px;
      }
      .info-item {
        flex: 1;
        min-width: 150px;
      }
      .info-item h3 {
        color: white;
        margin-bottom: 5px;
        font-size: 1.3rem;
      }
      .info-item p {
        color: var(--text-muted);
        margin: 0;
        line-height: 1.6;
      }
      #contact-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #contact-form input, #contact-form textarea {
        padding: 15px 20px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-family: 'Outfit', sans-serif;
        font-size: 1.1rem;
        transition: border-color 0.3s;
      }
      #contact-form textarea {
        min-height: 150px;
        resize: vertical;
      }
      #contact-form input:focus, #contact-form textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>
    <header class="glass-header" style="background: #0f1014; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <div class="logo">Quick<span>Dine</span></div>
      <nav>
        <a href="/">Home</a>
        <a href="/menu.html">Menu</a>
        <a href="/reservations.html">Reservations</a>
        <a href="/contact.html" style="color: var(--primary)">Contact</a>
      </nav>
      <div class="header-cart" style="justify-self: end; cursor: pointer; position: relative;">
        <svg width="24" height="24" fill="none" stroke="white" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span class="header-cart-count" style="position: absolute; top: -8px; right: -8px; background: var(--primary); color: white; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: bold; display: none;">0</span>
      </div>
    </header>

    <div class="page-container animate-up">
      <div class="contact-box">
        <h1>Contact Us</h1>
        <div class="contact-info">
          <div class="info-item">
            <h3>Address</h3>
            <p>123 Culinary Blvd<br>Food District, 90210</p>
          </div>
          <div class="info-item">
            <h3>Hours</h3>
            <p>Mon-Sun: 11am - 11pm</p>
          </div>
          <div class="info-item">
            <h3>Contact</h3>
            <p>hello@quickdine.com<br>+1 (555) 123-4567</p>
          </div>
        </div>
        <hr style="border-color: rgba(255,255,255,0.1); margin-bottom: 30px;">
        <form id="contact-form" onsubmit="event.preventDefault(); this.innerHTML = '<h3 style=\'color: #2ed573; text-align: center; font-size: 1.8rem;\'>Message Sent! ✓<br><br><span style=\'font-size: 1.1rem; color: var(--text-muted);\'>We will get back to you shortly.</span></h3>';">
          <div style="display: flex; gap: 20px;">
            <input type="text" placeholder="Your Name" required style="flex: 1;">
            <input type="email" placeholder="Your Email" required style="flex: 1;">
          </div>
          <textarea placeholder="How can we help you?" required></textarea>
          <button type="submit" class="cta-btn primary-btn large" style="margin-top: 10px;">Send Message</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/cart.js"></script>
  </body>
</html>
